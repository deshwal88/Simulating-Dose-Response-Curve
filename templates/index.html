<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dose-Response Curve Simulator (4PL)</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      label { display:block; margin-top:8px; }
      .row { display:flex; gap: 20px; }
      .col { flex: 1; }
      .controls { margin-bottom: 12px; }
      .error { color: red; }
      /* make disabled inputs more noticeable */
      input:disabled, textarea:disabled {
        background-color: #fff3b0; /* pale yellow */
        color: #333;
        border: 1px solid #e6c200; /* darker yellow border */
        opacity: 1; /* avoid default faded look */
      }
    </style>
  </head>
  <body>
    <h2>Dose-Response Curve Simulator (4PL)</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="row controls">
        <div class="col">
          <label>A (lower) min <input name="A_min" type="number" step="0.1" value="{{ params.A_min }}"></label>
          <label>A (lower) max <input name="A_max" type="number" step="0.1" value="{{ params.A_max }}"></label>
        </div>
        <div class="col">
          <label>B (slope) min <input name="B_min" type="number" step="0.1" value="{{ params.B_min }}"></label>
          <label>B (slope) max <input name="B_max" type="number" step="0.1" value="{{ params.B_max }}"></label>
        </div>
        <div class="col">
          <label>C (EC50) min <input name="C_min" type="number" step="0.1" value="{{ params.C_min }}"></label>
          <label>C (EC50) max <input name="C_max" type="number" step="0.1" value="{{ params.C_max }}"></label>
        </div>
        <div class="col">
          <label>D (upper) min <input name="D_min" type="number" step="0.1" value="{{ params.D_min }}"></label>
          <label>D (upper) max <input name="D_max" type="number" step="0.1" value="{{ params.D_max }}"></label>
        </div>
      </div>

      <div class="row controls">
        <div class="col">
          <fieldset style="padding:10px; border:1px solid #ccc;">
            <legend style="font-weight:600;">Dilution Settings</legend>
            <div style="display: flex; justify-content:space-between; width:80%">
              <div style="min-width:200px;">
                <label>Top concentration <input name="top_conc" type="number" step="0.1" value="{{ params.top_conc }}"></label>
              </div>
              <div style="min-width:160px;">
                <label>Even dilution factor <input name="dil_factor" type="number" step="0.1" value="{{ params.dil_factor }}"></label>
              </div>
              </div>
              
              
              <div style="display: flex; justify-content:space-between; width:80%">
                <label>Scheme mode
                  <select id="scheme_mode_select" name="scheme_mode">
                    <option value="even" {% if params.scheme_mode=='even' %}selected{% endif %}>Even</option>
                    <option value="custom" {% if params.scheme_mode=='custom' %}selected{% endif %}>Custom</option>
                  </select>
                </label>
                <label>Custom 7 dilution factors (comma-separated)
                  <input id="custom_factors_input" name="custom_factors" type="text" value="{{ params.custom_factors }}" style="width:260px" {% if params.scheme_mode=='even' %}disabled{% endif %}>
                </label>
              </div>
              <label>Recommended dilution factors
                <select id="recommended_dil" name="recommended_dil">
                  <option value="">-- choose --</option>
                  {% for f, series in recommendations %}
                    <option value="{{ f }}" data-series="{{ series|join(',') }}">{{ f }}-fold ({{ series|join(', ') }})</option>
                  {% endfor %}
                </select>
              </label>
            </div>
          </fieldset>
        </div>
      </div>

      <button type="submit">Update</button>
    </form>

    <script>
      // when a recommendation is chosen, copy the factor to the dil_factor input
      (function(){
        var sel = document.getElementById('recommended_dil');
        if(!sel) return;
        sel.addEventListener('change', function(){
          var v = this.value;
          if(v !== ''){
            var inp = document.querySelector('input[name="dil_factor"]');
            if(inp) inp.value = v;
          }
        });
      })();
      // enable/disable custom factors input based on scheme mode selection
      (function(){
        var scheme = document.getElementById('scheme_mode_select');
        var customInp = document.getElementById('custom_factors_input');
        if(!scheme || !customInp) return;
        function update(){
          if(scheme.value === 'even'){
            customInp.disabled = true;
          } else {
            customInp.disabled = false;
          }
        }
        scheme.addEventListener('change', update);
        // initial state
        update();
      })();
      document.addEventListener('DOMContentLoaded', function() {
      const recommendedScheme = document.getElementById('recommended-scheme');
      const evenScheme = document.getElementById('even-scheme');
      const customInput = document.getElementById('custom-input');

      evenScheme.addEventListener('change', function() {
        if (recommendedScheme.checked) {
          evenScheme.value = ''; // Toggle off even scheme
          customInput.value = recommendedScheme.value; // Copy value to custom input
          updateFunction(customInput.value); // Call update function
        }
      });
  });

    </script>

    <hr>
    <div>
      <h3>Main dose-response curves</h3>
      <div>{{ main_plot | safe }}</div>
    </div>

    <h3>Edge-case grid</h3>
    <div>{{ edge_plot | safe }}</div>

    <p style="font-size:0.9em">{{ notes }}</p>
  </body>
</html>
